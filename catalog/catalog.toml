[[tool]]
id = "node"
name = "Node.js 22"
group = "languages"
description = "The Node.js 22 long-term-support runtime with npm."
homepage = "https://nodejs.org"
source = "https://nodejs.org/en/download"
verified = true
verification = "vendor_checksum"
size_mb = 190
detect = { bin = "node", version_cmd = ["node", "--version"] }
[tool.updates]
how = "manual"
detail = "Install it again from this page to move to the newest 22.x release."
[[tool.install]]
kind = "release"
base_url = "https://nodejs.org/dist/latest-v22.x/"
asset = "node-v22.*-linux-{arch}.tar.xz"
checksum_url = "https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt"
checksum_format = "sums"
extract = "tar_xz"
strip = 1
bins = [{ name = "node", path = "bin/node" }, { name = "npm", path = "bin/npm" }, { name = "npx", path = "bin/npx" }]
[tool.install.arch_names]
amd64 = "x64"
arm64 = "arm64"
[[tool.remove]]
kind = "user_remove"
paths = [".local/bin/node", ".local/bin/npm", ".local/bin/npx", ".local/opt/node"]

