[[tool]]
id = "zed-remote"
name = "Zed remote server"
group = "editors"
description = "Lets the Zed editor on your own computer open this box. Zed puts its server on the box itself the first time you connect."
homepage = "https://zed.dev"
source = "https://zed.dev/docs/remote-development"
verified = true
verification = "client_managed"
size_mb = 0
post_install = "Open the box from Zed on your computer; it installs and updates its own server."
[tool.updates]
how = "client"
detail = "Zed on your computer installs and updates it."
[[tool.install]]
kind = "client_managed"
note = "Nothing to install on the box. Zed installs its own server when you connect."
[[tool.remove]]
kind = "client_managed"
note = "Nothing to remove from the box. Zed's server lives in your home folder and Zed manages it."

[[tool]]
id = "vscode-desktop"
name = "VS Code (desktop)"
group = "editors"
description = "The desktop VS Code application, for the box's remote desktop. The browser VS Code is always there."
homepage = "https://code.visualstudio.com"
source = "https://code.visualstudio.com/docs/setup/linux"
verified = false
unverified_reason = "Microsoft's setup page gives the key URL and the repository but does not publish the key's fingerprint, so the key cannot be checked against the vendor's own statement."
verification = "unverified"
size_mb = 400

[[tool]]
id = "claude-code"
default = true
name = "Claude Code"
group = "ai-agents"
description = "Anthropic's coding agent for the terminal."
homepage = "https://claude.com/claude-code"
source = "https://code.claude.com/docs/en/setup"
verified = true
verification = "apt_key_fingerprint"
size_mb = 220
detect = { bin = "claude", version_cmd = ["claude", "--version"] }
post_install = "Sign in on the box: run `claude` in a terminal."
[tool.updates]
how = "apt"
detail = "Installed from Anthropic's signed package source; unattended upgrades take new versions from it. `claude update` is not needed."
[[tool.install]]
kind = "apt_repo"
name = "claude-code"
key_url = "https://downloads.claude.ai/keys/claude-code.asc"
key_fingerprints = ["31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE"]
uri = "https://downloads.claude.ai/claude-code/apt/stable"
suite = "stable"
components = ["main"]
packages = ["claude-code"]
[[tool.remove]]
kind = "apt_repo_remove"
name = "claude-code"
packages = ["claude-code"]

[[tool]]
id = "codex"
name = "Codex CLI"
