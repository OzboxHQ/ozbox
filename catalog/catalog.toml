# The Oz Box tool catalog. Data, not code: each tool says where it comes from, how that source is checked, how it is
# removed and how it keeps itself current. `verified = false` means the source could not be confirmed from the vendor's
# own documentation; such a tool carries no install steps and no plan will include it.
# Apt package names are Ubuntu 24.04 (noble). Rules are enforced by the tests in crates/ozbox-catalog.
schema = 1
version = "2026.11.3"

[[group]]
id = "editors"
name = "Editors"
[[group]]
id = "ai-agents"
name = "AI agents"
[[group]]
id = "local-ai"
name = "Local AI (GPU boxes)"
[[group]]
id = "file-managers"
name = "File managers"
[[group]]
id = "languages"
name = "Languages"
[[group]]
id = "containers-databases"
name = "Containers and databases"
[[group]]
id = "cloud-infra"
name = "Cloud and infrastructure CLIs"
[[group]]
id = "browsers-tools"
name = "Browsers and test tools"

[[bundle]]
id = "web"
name = "Web / full-stack"
description = "Node with pnpm and bun, Deno, containers, a Postgres client."
tools = ["node", "pnpm", "bun", "deno", "podman", "postgresql-client"]

[[bundle]]
id = "python-data"
name = "Python / data"
description = "Python with uv, Jupyter, SQLite and a Postgres client."
tools = ["python", "uv", "jupyterlab", "sqlite", "postgresql-client"]

[[bundle]]
id = "infra"
name = "Infra / cloud"
description = "Packer, Helm, kubectl and the GitHub CLI."
tools = ["packer", "helm", "kubectl", "github-cli"]

[[bundle]]
id = "ai-agents"
name = "AI agents"
description = "Claude Code, Codex CLI, Gemini CLI and Aider."
tools = ["claude-code", "codex", "gemini-cli", "aider"]

[[tool]]
id = "neovim"
name = "Neovim"
group = "editors"
description = "A fast terminal editor."
homepage = "https://neovim.io"
source = "https://packages.ubuntu.com/noble/neovim"
verified = true
verification = "apt_archive"
size_mb = 30
detect = { bin = "nvim", version_cmd = ["nvim", "--version"] }
[tool.updates]
how = "apt"
detail = "Security updates install by themselves. A newer version arrives with the next image release."
[[tool.install]]
kind = "apt_install"
packages = ["neovim"]
[[tool.remove]]
kind = "apt_remove"
packages = ["neovim"]

