[package]
name = "ozbox-core"
description = "Core types for Oz Box: box specs, the size catalogue, plans, and the provider interface."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "3"
yaml-rust2 = { version = "0.11", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
ozbox-seal = { path = "../ozbox-seal" }

[lints]
workspace = true

