[package]
name = "ozbox-plugin"
description = "The Oz Box plugin protocol: the types and helpers for writing a provider or tunnel plugin, and (with the `host` feature) the code that runs one."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# The host side: run a plugin program, check its approval, and wrap a provider plugin as an `ozbox_core::Backend`.
host = ["dep:ozbox-core", "dep:ring", "dep:toml"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ozbox-core = { workspace = true, optional = true }
ring = { version = "0.17", optional = true }
toml = { version = "1.2", optional = true }

[dev-dependencies]
ozbox-core.workspace = true
tempfile = "3"
ring = "0.17"
toml = "1.2"

[[test]]
name = "host"
required-features = ["host"]

[lints]
workspace = true
