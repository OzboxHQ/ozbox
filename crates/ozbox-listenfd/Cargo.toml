[package]
name = "ozbox-listenfd"
description = "Takes the listening sockets (Unix or TCP) that systemd passed to this process (socket activation)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# The one place in the program that adopts a raw file descriptor, which std can only do with `unsafe`: a descriptor that
# systemd handed over is not something safe Rust can name. Everything else keeps the workspace's `forbid`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
