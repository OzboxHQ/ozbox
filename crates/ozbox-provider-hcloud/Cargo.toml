[package]
name = "ozbox-provider-hcloud"
description = "Hetzner Cloud provider for Oz Box: lifecycle through OpenTofu, runtime actions through the Hetzner API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ozbox-core.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[features]
# The in-memory Hetzner API and `tofu` (`testing::Sim`), for other crates' tests. Never enabled in a release build.
testing = []

[dev-dependencies]
ozbox-provider-fake = { path = "../ozbox-provider-fake" }

[lints]
workspace = true
