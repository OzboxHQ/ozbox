name: Publish npm packages

# Publishes the packages listed in packaging/npm-packages.txt to npm, with npm Trusted Publishing (GitHub OIDC) and
# provenance. There is no NPM_TOKEN anywhere. While the list is empty (it is, on purpose) this does nothing.
#
# Each package is packed, the tarball is installed in a clean directory and its smoke command is run BEFORE anything is
# published, and a real publish waits for the owner's approval of the `npm` environment.
#
# npm setup (once, by the owner): for each package, on npmjs.com -> the package -> Settings -> Trusted Publisher: this
# repository, the workflow file name publish-npm.yml and the environment npm. A package must exist before a trusted
# publisher can be linked, so the first version of a new package is published by hand (with 2FA), then linked.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  list:
    name: Which packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.l.outputs.packages }}
      any: ${{ steps.l.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: l
        run: |
          set -euo pipefail
          packages="$(scripts/release/npm-packages.sh list | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "packages=$packages" >>"$GITHUB_OUTPUT"
          if [ "$packages" = "[]" ]; then
            echo "any=false" >>"$GITHUB_OUTPUT"
            echo "No npm packages are listed in packaging/npm-packages.txt; nothing to publish."
          else
            echo "any=true" >>"$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish ${{ matrix.package }}
    needs: list
    if: needs.list.outputs.any == 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.list.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: The tag is on main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # the same rule as the program's release: a tag that is not on main is not a release
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $REF_NAME is not on main: merge first, then tag" >&2; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@11.21.1
      - name: The package is public and its version is the release's
        env:
          PACKAGE: ${{ matrix.package }}
          REF_NAME: ${{ github.ref_name }}
        run: scripts/release/npm-packages.sh check-version "$PACKAGE" "${REF_NAME#v}"
      - name: Pack it, install the tarball in a clean directory, run its smoke command
        env:
          PACKAGE: ${{ matrix.package }}
        run: scripts/release/npm-packages.sh smoke "$PACKAGE"
      - name: Publish with trusted publishing (OIDC), with provenance
        working-directory: ${{ matrix.package }}
        run: |
          set -euo pipefail
          # no token: a publish that cannot prove it came from this workflow must fail, not fall back to a secret
          rm -f "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public
