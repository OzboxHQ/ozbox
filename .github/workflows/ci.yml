name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On main every push gets a complete run (queued, never cancelled); on other refs a newer push replaces the old run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Google Chrome as the image has it (the current stable from Google, not the runner image's older copy)
        run: |
          set -euo pipefail
          curl -sSfLo /tmp/google-chrome-stable.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y --no-install-recommends /tmp/google-chrome-stable.deb
          google-chrome --version
      - name: OpenSSH, so the ingress account's sshd block is checked by the real `sshd -t`, never only by a fake
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
          /usr/sbin/sshd -V 2>&1 | head -1 || true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (a runner without sshd fails the ingress tests rather than skipping them)
        env:
          OZBOX_REQUIRE_SSHD: "1"
        run: cargo test --workspace --locked
      - name: A release build refuses to compile without the dashboard (so a program serving the placeholder can not ship)
        run: |
          set -euo pipefail
          test ! -e packages/dashboard/dist
          if OZBOX_RELEASE=1 cargo check -p ozbox-cli --locked >/tmp/release-check.log 2>&1; then
            echo "a release build without the dashboard was accepted"; exit 1
          fi
          grep -q "this is a release build and the dashboard is not built" /tmp/release-check.log

  msrv:
    name: Rust on the declared minimum version (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain at the declared rust-version (an API newer than it fails here, not for a user)
        run: |
          set -euo pipefail
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: msrv
      - name: "Build every crate and test on that version (clippy's incompatible_msrv is not a substitute: it can be allowed away)"
        run: cargo +"$MSRV" check --workspace --all-targets --locked


  dashboard:
    name: Dashboard (typecheck, lint, test, build, browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build ozbox with the dashboard embedded
        working-directory: .
        run: cargo build -p ozbox-cli -p ozboxd --locked
      - name: Browser tests (ozbox serve with the fake provider; the same script runs on any machine)
        working-directory: .
        run: OZBOX_E2E_WITH_DEPS=1 OZBOX_BIN="$GITHUB_WORKSPACE/target/debug/ozbox" scripts/e2e-local.sh --no-build
      - name: Keep what a failed browser test saw (page snapshot, trace)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-e2e-failures
          path: packages/dashboard/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Browser tests against a real ozboxd and a real ozbox serve (G7 tier B; Linux only, no stand-ins)
        env:
          OZBOX_BIN: ${{ github.workspace }}/target/debug/ozbox
          AWS_EC2_METADATA_DISABLED: "true"
        run: npm run e2e:real

  browser-e2e:
    name: Browser on the box (real Chromium against the local test site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Google Chrome as the image has it (the current stable from Google, not the runner image's older copy)
        run: |
          set -euo pipefail
          curl -sSfLo /tmp/google-chrome-stable.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y --no-install-recommends /tmp/google-chrome-stable.deb
          google-chrome --version
      - name: The worker against a real browser (approvals, refusals, hand-off, take-over, downloads, extraction, recording, limits)
        env:
          OZBOX_REQUIRE_BROWSER: "1"
        run: cargo test -p ozbox-browser --locked
      - name: The tool host's browser tools (every call decided and audited)
        run: cargo test -p ozbox-cli --locked browser

  infra:
    name: Infrastructure (OpenTofu, Packer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.13.2
      - name: tofu fmt
        run: tofu fmt -check -recursive infra/
      - name: tofu validate (every module)
        run: |
          set -euo pipefail
          for dir in $(find infra/tofu -name '*.tf' -exec dirname {} \; | sort -u); do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -input=false >/dev/null
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: no inbound rules (structural guard)
        run: infra/tofu/check-no-ingress.sh
      - name: tofu test (every module, mocked providers, no credentials)
        run: |
          set -euo pipefail
          for d in infra/tofu/modules/*/; do
            echo "::group::$d"
            tofu -chdir="$d" init -backend=false -input=false >/dev/null
            tofu -chdir="$d" test
            echo "::endgroup::"
          done
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
        with:
          version: 1.11.2
      - name: packer validate (every template)
        env:
          # Plugin lookups go through the GitHub API; without a token the runner's shared address is rate limited.
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for dir in $(find infra/packer -name '*.pkr.hcl' -exec dirname {} \; | sort -u); do
            echo "::group::$dir"
            packer init "$dir"
            packer validate -syntax-only "$dir"
            echo "::endgroup::"
          done
      - name: packer validate (image template, with and without an instance profile)
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir=infra/packer/ozbox-image
          packer init "$dir"
          # Full validation (not -syntax-only) for the AWS source, because the fallback policy document is only
          # checked against the plugin's schema there. Profile unset: Packer builds a temporary profile from the
          # policy block. Profile set: the block is not rendered.
          # the file provisioners check that their source exists, so stand-in binaries are enough for validation
          tmp="$(mktemp -d)"
          : >"$tmp/ozboxd"
          : >"$tmp/ozbox"
          common=(-only=ozbox.amazon-ebs.ozbox -var aws_subnet_id=subnet-00000000 -var aws_security_group_id=sg-00000000 -var "ozboxd_binary=$tmp/ozboxd" -var "ozbox_binary=$tmp/ozbox")
          echo "::group::profile unset"
          packer validate "${common[@]}" -var aws_instance_profile= "$dir"
          echo "::endgroup::"
          echo "::group::profile set"
          packer validate "${common[@]}" -var aws_instance_profile=ozbox-build "$dir"
          echo "::endgroup::"

  deny:
    name: Dependency policy (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  npm-audit:
    name: Dashboard dependency audit (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high

  safety:
    name: Public safety and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: No references to a private deployment
        run: scripts/public-safety.sh
      - name: No design or implementation documents in this repository
        run: scripts/no-build-docs.sh
      - name: Shell scripts parse (the real-AWS smoke test is never run in CI)
        run: |
          set -euo pipefail
          for f in scripts/*.sh infra/tofu/*.sh infra/box/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: shellcheck
        run: shellcheck scripts/*.sh infra/tofu/*.sh infra/box/*.sh
      - name: Workflow files (actionlint, with shellcheck on every run block)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose
