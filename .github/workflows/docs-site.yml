name: Docs site

# Checks the documentation site (docs-site/, generated from docs/). Nothing here publishes: the site owner connects
# Mintlify hosting to docs-site/ in the repository settings, and the hosted build reads the committed pages.

on:
  push:
    branches: [main]
    paths: ["docs/**", "docs-site/**", "SECURITY.md", "ROADMAP.md", ".github/workflows/docs-site.yml"]
  pull_request:
    paths: ["docs/**", "docs-site/**", "SECURITY.md", "ROADMAP.md", ".github/workflows/docs-site.yml"]

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    name: Docs site (generate, validate, compile, links, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - name: Script tests
        run: npm test
      - name: Generated pages match docs/ (run `npm run build` in docs-site if this fails)
        run: node scripts/build-site.mjs --check
      - name: Validate (navigation, front matter, vocabulary, links)
        run: node scripts/validate-docs.mjs .
      - name: Compile every page the way the hosted build does
        run: node scripts/compile-check.mjs .
      - name: Offline link check (the hard gate)
        run: node scripts/check-links.mjs .
      # Until the repository is public the work happens on main directly, so the placeholder is allowed on a push to main;
      # a pull request into main and a release tag must not carry one.
      - name: No changelog entry may keep a placeholder date in a release (run `npm run stamp-release`)
        if: github.base_ref == 'main' || startsWith(github.ref, 'refs/tags/')
        run: node scripts/validate-docs.mjs . --strict-dates
      # Extra, not a gate: the hosted tool's own check needs the network and its own toolchain, which can fail for
      # reasons that have nothing to do with the pages. The offline check above is the one that blocks.
      - name: Mintlify broken-links (informational)
        continue-on-error: true
        run: npx --yes mint@4.2.810 broken-links
