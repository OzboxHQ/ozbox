name: CLI release

# Builds the `ozbox` program for Linux (x86_64 and aarch64, statically linked with musl) and macOS (arm64 and x86_64), signs
# it with Sigstore (keyless, GitHub OIDC) and publishes it as assets of the release `v<version>`, with its SHA256, and a
# signed manifest `ozbox-cli-manifest.json` that `ozbox dashboard install` and scripts/install.sh verify before they use
# anything.
#
# The build and the test of the packed artefact are release-build.yml (also run, without publishing, by
# release-dry-run.yml). The job that signs lives HERE, because a keyless certificate names the workflow file that signed:
# verifiers require this file's name, on the main branch or a v* tag.
#
# A real release needs: a `v*` tag pushed (or a manual run with dry_run turned off, from main), AND the owner's approval
# of the `release` environment. Nothing here holds a key. A manual run defaults to a DRY RUN: the whole pipeline runs and
# nothing is signed or published; the assembled files are kept as an artifact for 7 days.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.0 or 0.1.0-rc.1 (a real release must equal the version in Cargo.toml)"
        required: true
        type: string
      dry_run:
        description: "Dry run: build and test everything, sign and publish nothing (turn off only for a real release)"
        required: true
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide the version and whether this is real
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: v
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          # a pushed tag is always a real release; a manual run is real only when dry_run is explicitly false
          if [ "$EVENT" = "push" ]; then
            dry_run=false
            version="${REF_NAME#v}"
          else
            dry_run="${IN_DRY_RUN:-true}"
            version="$IN_VERSION"
            version="${version#v}"
          fi
          # The same shape the program checks before it looks for a release.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9a-z.]+)?$'; then
            echo "not a release version: $version" >&2
            exit 1
          fi
          if [ "$dry_run" = "false" ]; then
            # The certificate names this file at this ref, and verifiers accept only main or a v tag.
            if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" != "main" ]; then
              echo "a real release is made from main or a v tag, not from branch $REF_NAME" >&2
              exit 1
            fi
            if [ "$REF_TYPE" = "tag" ]; then
              git fetch --no-tags origin main
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "tag $REF_NAME is not on main: merge first, then tag" >&2
                exit 1
              fi
            fi
            # The changelog says when each change shipped, so a real release carries no placeholder date: stamp them first
            # (`npm run stamp-release` in docs-site/). The validator needs only Node, which the runner has.
            ( cd docs-site && node scripts/validate-docs.mjs . --strict-dates ) || {
              echo "the changelog still has [Release date] entries: run npm run stamp-release in docs-site/, merge, then tag" >&2
              exit 1
            }
            # `ozbox --version` prints the version in Cargo.toml; a release that says otherwise confuses everyone.
            cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
            if [ "$cargo_version" != "$version" ]; then
              echo "the release is $version but Cargo.toml says $cargo_version: change the workspace version first" >&2
              exit 1
            fi
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >>"$GITHUB_OUTPUT"
          echo "ozbox $version, dry run: $dry_run"

  build:
    name: Build, assemble and test the artefact
    needs: plan
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  dry-run:
    name: Dry run (nothing is signed or published)
    needs: [plan, build]
    if: needs.plan.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          # Pinned: cosign 3 no longer writes the .sig/.pem files that older verifiers (and `ozbox dashboard install`) read.
          cosign-release: "v2.5.3"
      - name: The pinned cosign accepts the signing flags
        run: scripts/release/cosign-smoke.sh
      - name: Summary
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          {
            echo "### Dry run of ozbox $VERSION"
            echo
            echo "Built, assembled and tested. Nothing was signed or published. The files are in the artifact release-out."
          } >>"$GITHUB_STEP_SUMMARY"

  publish:
    name: Sign and publish
    needs: [plan, build]
    if: needs.plan.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    # The owner approves every real release here (required reviewers on the `release` environment).
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-out
          path: out
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: "v2.5.3"
      - name: The pinned cosign accepts the signing flags
        run: scripts/release/cosign-smoke.sh
      - name: Sign the manifest, the checksums and each program (Sigstore keyless, GitHub OIDC)
        working-directory: out
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          for f in ozbox-cli-manifest.json SHA256SUMS ozbox-linux-x86_64 ozbox-linux-aarch64 ozbox-darwin-x86_64 ozbox-darwin-aarch64; do
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              --bundle "$f.sigstore.json"
            # verify what was just signed, with the identity everyone else will require
            cosign verify-blob "$f" \
              --signature "$f.sig" --certificate "$f.pem" \
              --certificate-identity "https://github.com/$REPO/.github/workflows/cli-release.yml@$REF" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          done
          ls -l
      - name: Create the release as a draft, upload everything, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          notes="The ozbox command line $VERSION for Linux and macOS (x86_64 and arm64), signed with Sigstore.

          Install, verifying the signature: download scripts/install.sh from this repository, read it, then run it with --version $VERSION. It needs cosign. The manual way: verify ozbox-cli-manifest.json with cosign verify-blob against the cli-release workflow of $REPO, then check the program's sha256 against the manifest (or SHA256SUMS)."
          flags=(--draft --title "ozbox $VERSION" --notes "$notes" --target "$GITHUB_SHA")
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "${flags[@]}"
          fi
          gh release upload "$tag" out/* --clobber
          gh release edit "$tag" --draft=false
