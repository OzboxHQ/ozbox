body:
  - type: markdown
    attributes:
      value: |
        Ask how to do something or why something behaves the way it does. Please search first, and never paste a key, a token or
        anything private. For a security problem do not post here: see SECURITY.md.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: The command you ran and what you saw (remove names and addresses you want to keep private).
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `ozbox --version`.
