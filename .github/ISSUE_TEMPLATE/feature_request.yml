name: Feature request
description: Suggest something Oz Box could do, or do better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: A short description of the problem is worth more than a finished design. Please do not include keys or private data.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can you not do today, or what is harder than it should be?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Dashboard
        - Boxes and images
        - Agents and approvals
        - Secrets
        - Providers
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
